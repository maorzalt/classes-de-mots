<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Classes de mots">
<title>Classes de mots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root {
  --bg: #F2F3F8;
  --surface: #FFFFFF;
  --surface2: #E8EAF2;
  --ink: #171A2B;
  --muted: #5C6279;
  --line: #D8DBE6;
  --primary: #2F55D4;
  --primary-ink: #FFFFFF;
  --ok: #1F9D6A;  --ok-bg: #E2F5EB;
  --bad: #D24B47; --bad-bg: #FBE6E5;
  --warn: #A96C0F; --warn-bg: #FBF0D9;
  --c-nom: #D64545;
  --c-det: #DE7A1C;
  --c-adj: #B08A12;
  --c-pro: #C93F8F;
  --c-verbe: #7A3DB8;
  --c-adv: #1B8E7D;
  --c-prep: #2A78C2;
  --c-conj: #3B9A3B;
  --c-manip: #5C6279;
  --accent: var(--primary);
  --shadow: 0 1px 2px rgba(23,26,43,.06), 0 8px 24px -12px rgba(23,26,43,.18);
  --r: 14px;
  --font-body: "Nunito", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-head: "Outfit", "Nunito", -apple-system, "Segoe UI", sans-serif;
  --tutor: #6B4FD8;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121420; --surface: #1B1E2C; --surface2: #262A3B; --ink: #EEF0F7; --muted: #A3A9BE; --line: #303549;
    --primary: #7D95FF; --primary-ink: #0F1220;
    --ok: #4CC58C; --ok-bg: #16332A; --bad: #F48A86; --bad-bg: #3B2022; --warn: #E3B65A; --warn-bg: #3A2F16;
    --c-nom: #F27070; --c-det: #F2A050; --c-adj: #E2BE3C; --c-pro: #EA74B9; --c-verbe: #B58AEC; --c-adv: #47C4B2; --c-prep: #6DACF2; --c-conj: #6FC86F; --c-manip: #A3A9BE;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
    --tutor: #A08BFF;
  }
}
:root[data-theme="dark"] {
  --bg: #121420; --surface: #1B1E2C; --surface2: #262A3B; --ink: #EEF0F7; --muted: #A3A9BE; --line: #303549;
  --primary: #7D95FF; --primary-ink: #0F1220;
  --ok: #4CC58C; --ok-bg: #16332A; --bad: #F48A86; --bad-bg: #3B2022; --warn: #E3B65A; --warn-bg: #3A2F16;
  --c-nom: #F27070; --c-det: #F2A050; --c-adj: #E2BE3C; --c-pro: #EA74B9; --c-verbe: #B58AEC; --c-adv: #47C4B2; --c-prep: #6DACF2; --c-conj: #6FC86F; --c-manip: #A3A9BE;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  --tutor: #A08BFF;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
b, strong { font-weight: 800; }
button { font: inherit; color: inherit; }
.svg { display: inline-flex; line-height: 0; }
[hidden] { display: none !important; }

/* ---------- Coquille ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 8px;
  padding: 10px 12px 8px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.top.home { grid-template-columns: auto 1fr auto auto; }
.top .prog { grid-column: 1 / -1; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.top .prog-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s ease; }
.brand { font-family: var(--font-head); font-weight: 700; font-size: 18px; letter-spacing: .01em; }
.spacer { flex: 1; }
.top-mid { min-width: 0; text-align: center; }
.top-title { font-family: var(--font-head); font-weight: 700; font-size: 16px; line-height: 1.1; color: var(--accent); text-wrap: balance; }
.top-sub { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.timer { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); font-weight: 700; padding: 4px 8px; border-radius: 8px; background: var(--surface2); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--surface2); }
.icon-btn:focus-visible, .btn:focus-visible, .opt:focus-visible, .tok:focus-visible, .type-in:focus-visible, .link-btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

.main { flex: 1; padding-block: 18px 24px; padding-inline: 16px; display: flex; flex-direction: column; gap: 16px; }
.bar {
  position: sticky; bottom: 0; z-index: 5; display: flex; gap: 10px; align-items: center;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line);
}
.bar .btn.primary { flex: 1; }
.bar .btn.ghost { flex: 0 0 auto; }

/* ---------- Boutons ---------- */
.btn {
  min-height: 50px; padding: 10px 18px; border-radius: 14px; border: 2px solid transparent; cursor: pointer;
  font-weight: 800; font-size: 16px; line-height: 1.2; text-align: center; transition: transform .06s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--primary-ink); }
.btn.primary:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost:disabled { opacity: .5; cursor: default; }
.btn.small { min-height: 40px; padding: 6px 14px; font-size: 14.5px; background: var(--surface); border-color: var(--line); }
.btn.small:hover { border-color: var(--accent); }
.link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 14.5px; align-self: center; padding: 8px; }
.tutor-btn { display: none; background: color-mix(in srgb, var(--tutor) 12%, var(--surface)); color: var(--tutor); border-color: color-mix(in srgb, var(--tutor) 35%, transparent); }
body.has-tutor .tutor-btn { display: inline-flex; align-items: center; justify-content: center; }
.tutor-btn.inline { margin-top: 10px; min-height: 42px; font-size: 15px; }

/* ---------- Accueil ---------- */
.hero { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: clamp(30px, 8vw, 40px); line-height: 1.05; text-wrap: balance; letter-spacing: -.01em; }
h2 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 26px; line-height: 1.15; text-wrap: balance; }
h3 { margin: 0 0 8px; font-family: var(--font-head); font-weight: 700; font-size: 18px; }
.lead { margin: 0; font-size: 17px; color: var(--ink); max-width: 36em; }
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.leg { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 999px; }
.leg.var { background: color-mix(in srgb, var(--c-nom) 14%, var(--surface)); color: var(--c-nom); }
.leg.inv { background: color-mix(in srgb, var(--c-prep) 14%, var(--surface)); color: var(--c-prep); }

.modlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.modrow {
  display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 12px;
  padding: 12px 12px 12px 14px; background: var(--surface); border-radius: var(--r); border: 2px solid transparent;
  border-left: 5px solid var(--accent, var(--line));
}
.modrow.next { border-color: var(--accent, var(--primary)); box-shadow: var(--shadow); }
.modrow.exam { --accent: var(--primary); }
.moddot { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--accent, var(--primary)) 14%, var(--surface)); color: var(--accent, var(--primary)); }
.modrow.done .moddot { background: var(--ok-bg); color: var(--ok); }
.modtxt { min-width: 0; }
.modname { font-family: var(--font-head); font-weight: 700; font-size: 17px; line-height: 1.2; }
.modmeta { font-size: 13.5px; color: var(--muted); }
.foot-note { margin: 0; font-size: 14px; color: var(--muted); }
.warn-box { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn); font-weight: 700; font-size: 15px; }

/* ---------- Puces de classe ---------- */
.chip-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; padding: 4px 11px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); }
.exam-chip { --accent: var(--primary); }
.lesson-count, .qcount { font-size: 14px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Leçon ---------- */
.lesson-h { color: var(--accent); }
.lesson-h .sym { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 14%, var(--surface)); font-size: .8em; vertical-align: middle; }
.lesson-b { background: var(--surface); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; font-size: 17px; }
.lesson-b p { margin: 0; }
.lesson-b .ex { padding: 10px 14px; border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border-radius: 0 10px 10px 0; font-size: 16.5px; line-height: 1.55; }
.lesson-b .warn { padding: 10px 14px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.lesson-b .tbl { display: grid; gap: 6px; }
.lesson-b .tbl > div { padding: 8px 12px; background: var(--surface2); border-radius: 10px; font-size: 15.5px; line-height: 1.4; }
.lesson-b .tbl small { color: var(--muted); font-size: 13.5px; }
.lesson-b u { text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.lesson-b s { color: var(--muted); }
.intro-note { margin: 0; color: var(--muted); font-size: 15px; font-style: italic; }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: auto; padding-top: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.seen { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.dot.on { background: var(--accent); width: 22px; border-radius: 4px; }

/* ---------- Questions ---------- */
.item { display: flex; flex-direction: column; gap: 14px; }
.q { margin: 0; font-size: 18.5px; line-height: 1.45; font-weight: 600; }
.q b { color: var(--accent); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 10px; text-align: left;
  min-height: 52px; padding: 10px 14px 10px 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-size: 16.5px; line-height: 1.35;
}
.opt-l { width: 30px; height: 30px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; background: var(--surface2); color: var(--muted); }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.opt.sel .opt-l { background: var(--accent); color: var(--primary-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .opt-l { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .opt-l { background: var(--bad); color: #fff; }
.opt:disabled { cursor: default; }
.opt:disabled:not(.right):not(.wrong) { opacity: .6; }

.sentence { margin: 0; padding: 14px 14px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); font-size: 19px; line-height: 2; }
.tok { display: inline; padding: 3px 5px; margin: 0 -1px; border-radius: 8px; border: 2px solid transparent; background: transparent; cursor: pointer; line-height: 1.4; }
.tok:hover { background: var(--surface2); }
.tok.sel { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); border-color: var(--accent); }
.tok.right { background: var(--ok-bg); border-color: var(--ok); }
.tok.wrong { background: var(--bad-bg); border-color: var(--bad); text-decoration: line-through; }
.tok.missed { border-color: var(--warn); border-style: dashed; background: var(--warn-bg); }
.tok:disabled { cursor: default; }
.punct { color: var(--muted); }
.help { margin: 0; font-size: 14px; color: var(--muted); }

.type-in { width: 100%; min-height: 54px; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font-size: 19px; }
.type-in:focus { border-color: var(--accent); outline: none; }
.type-in.right { border-color: var(--ok); background: var(--ok-bg); }
.type-in.wrong { border-color: var(--bad); background: var(--bad-bg); }

.feedback { border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; border: 2px solid var(--line); background: var(--surface); }
.feedback.ok { border-color: var(--ok); background: var(--ok-bg); }
.feedback.bad { border-color: var(--bad); background: var(--bad-bg); }
.feedback.hint { border-color: var(--warn); background: var(--warn-bg); }
.feedback p { margin: 0; }
.fb-title { font-family: var(--font-head); font-weight: 700; font-size: 19px; }
.feedback.ok .fb-title { color: var(--ok); }
.feedback.bad .fb-title { color: var(--bad); }
.feedback.hint .fb-title { color: var(--warn); }
.fb-ans { font-size: 16.5px; }
.fb-why { font-size: 16px; line-height: 1.5; }
.fb-why u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
.fb-note { font-size: 14px; color: var(--muted); }

/* ---------- Fins ---------- */
.end { align-items: flex-start; }
.end h2 { font-size: 34px; }
.stars { display: flex; gap: 6px; font-size: 34px; line-height: 1; }
.star { color: var(--line); }
.star.on { color: var(--warn); }
.score { margin: 0; font-size: 20px; }
.score b { font-family: var(--font-head); font-size: 26px; color: var(--accent); }
.bytag { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.tagrow { display: grid; grid-template-columns: 110px 1fr 44px; align-items: center; gap: 10px; font-size: 15px; }
.tagname { font-weight: 800; color: var(--accent); }
.tagbar { height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
.tagfill { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.tagnum { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; }
.weak { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.weak .btn.small { border-left: 5px solid var(--accent); text-align: left; }
.review { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.err { background: var(--surface); border-radius: 12px; padding: 10px 14px; border-left: 5px solid var(--accent); }
.err summary { cursor: pointer; font-weight: 700; font-size: 15.5px; line-height: 1.4; }
.err-tag { display: inline-block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-right: 6px; }
.err p { margin: 8px 0 0; font-size: 15.5px; }

/* ---------- Feuille (aide-mémoire, tuteur) ---------- */
#sheet { position: fixed; inset: 0; z-index: 20; background: rgba(10,12,24,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet-box { width: 100%; max-width: 600px; max-height: 92%; background: var(--bg); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 40px rgba(0,0,0,.25); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px 18px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 22px; }
.sheet-body { overflow-y: auto; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
body.sheet-open { overflow: hidden; }
.memo-intro { margin: 0; font-weight: 700; }
.memo { background: var(--surface); border-radius: 12px; padding: 12px 14px; border-left: 5px solid var(--accent); display: flex; flex-direction: column; gap: 6px; font-size: 15.5px; }
.memo p { margin: 0; }
.memo-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.memo-kind { font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.memo-ex { color: var(--muted); font-style: italic; }
.tutor-out { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.bubble { padding: 10px 14px; border-radius: 14px; font-size: 16px; line-height: 1.5; white-space: pre-wrap; max-width: 92%; }
.bubble.me { align-self: flex-end; background: color-mix(in srgb, var(--tutor) 16%, var(--surface)); border-bottom-right-radius: 4px; }
.bubble.ai { align-self: flex-start; background: var(--surface); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.tutor-form { display: flex; gap: 8px; }
.tutor-form .type-in { flex: 1; font-size: 16px; min-height: 48px; }
.tutor-form .btn { min-height: 48px; --accent: var(--tutor); }
.muted { color: var(--muted); margin: 0; }
.muted.small { font-size: 13px; }

@media (min-width: 640px) {
  body { font-size: 16px; }
  .main { padding-inline: 24px; }
  .top, .bar { padding-inline: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head><body>
<div id="app" class="app" lang="fr"></div>
<div id="sheet" hidden></div>
<script>
/* ===== Données pédagogiques — Les classes de mots (Sec. 1, Partie 1, p. 158-182) ===== */

const CLASSES = {
  nom:  { label: 'Nom',         short: 'nom',  variable: true  },
  det:  { label: 'Déterminant', short: 'dét.', variable: true  },
  adj:  { label: 'Adjectif',    short: 'adj.', variable: true  },
  pro:  { label: 'Pronom',      short: 'pron.',variable: true  },
  verbe:{ label: 'Verbe',       short: 'v.',   variable: true  },
  adv:  { label: 'Adverbe',     short: 'adv.', variable: false },
  prep: { label: 'Préposition', short: 'prép.',variable: false },
  conj: { label: 'Conjonction', short: 'conj.',variable: false },
  manip:{ label: 'Manipulations', short: 'manip.', variable: null }
};
const CLASS_ORDER = ['nom','det','adj','pro','verbe','adv','prep','conj'];
const CLASS_OPTS = CLASS_ORDER.map(k => CLASSES[k].label);
const MANIP_OPTS = ['L’ajout', 'Le déplacement', 'L’effacement', 'L’encadrement', 'Le remplacement'];
const CAT_DET = ['défini', 'indéfini', 'possessif', 'démonstratif', 'numéral'];
const SENS_ADV = ['affirmation', 'négation', 'opposition', 'temps', 'lieu', 'manière', 'intensité', 'conséquence'];
const SENS_PREP = ['appartenance', 'temps', 'lieu / direction', 'cause / origine', 'but', 'moyen / manière', 'opposition', 'exclusion'];
const SENS_CONJ = ['addition', 'cause / explication', 'but', 'opposition / restriction', 'alternative', 'temps'];

/* Types d’items :
   mc   : { q, opts, a (index), why, hint? }
   tap  : { q, s (phrase; « ~ » colle deux jetons), a (mots cibles), why, hint? }
   type : { q, a (réponses acceptées), why, hint?, placeholder? }
   Tous : tag (classe visée pour le bilan)                                        */

const MODULES = [
/* ───────────────────────────── 0. MANIPULATIONS ───────────────────────────── */
{
  id: 'manip', cls: 'manip', title: 'Les manipulations syntaxiques', minutes: 4,
  intro: 'Cinq outils que tu vas utiliser dans tout le reste de l’entraînement.',
  defaultHint: 'Regarde ce qui a changé entre la phrase de départ et la phrase d’arrivée : on a ajouté, déplacé, effacé, encadré ou remplacé quelque chose ?',
  lesson: [
    { h: 'Cinq outils pour analyser une phrase',
      b: '<p>Les <b>manipulations syntaxiques</b> servent à vérifier la classe d’un mot, à trouver le sujet, à repérer les compléments… Pour l’examen, la plus utile est le <b>remplacement</b> : tu remplaces un mot par un autre mot dont tu connais la classe. Si la phrase tient, les deux mots sont de la même classe.</p>' },
    { h: 'L’ajout <span class="sym">+</span>',
      b: '<p>On <b>ajoute</b> un mot ou un groupe de mots.</p><p class="ex">J’ai une <b>idée</b>. → J’ai une <b>idée</b> <u>géniale</u>.</p><p>Utilité : trouver la classe d’un mot. On peut ajouter un adjectif après <i>idée</i> → <i>idée</i> est un <b>nom</b>.</p>' },
    { h: 'Le déplacement <span class="sym">↷</span>',
      b: '<p>On <b>déplace</b> un groupe de mots dans la phrase.</p><p class="ex">Mes voisins ont organisé une fête <u>l’automne dernier</u>. → <u>L’automne dernier</u>, mes voisins ont organisé une fête.</p><p>Utilité : un groupe déplaçable est un <b>complément de phrase</b>.</p>' },
    { h: 'L’effacement <span class="sym">⌫</span>',
      b: '<p>On <b>enlève</b> un mot ou un groupe.</p><p class="ex"><s>Les nuits sans lune,</s> des amateurs d’astronomie viennent camper ici.</p><p>Utilité : reconnaître ce qui est facultatif (complément de phrase) et trouver le noyau d’un groupe. Un <b>adverbe</b> est effaçable ; une <b>préposition</b> ne l’est pas.</p>' },
    { h: 'L’encadrement <span class="sym">[ ]</span>',
      b: '<p>On <b>encadre</b> un groupe de mots.</p><p>Par <i>c’est… qui</i> / <i>ce sont… qui</i> → tu trouves le <b>sujet</b> :</p><p class="ex"><u>Ce sont</u> les feuilles tombées au sol <u>qui</u> forment un joli tapis.</p><p>Par <i>ne… pas</i> → tu trouves le <b>verbe conjugué</b> :</p><p class="ex">Tu <u>ne</u> cours <u>pas</u> tous les matins.</p>' },
    { h: 'Le remplacement <span class="sym">⇄</span>',
      b: '<p>On <b>remplace</b> un mot par un autre mot de même classe.</p><p class="ex">Olga est <b>plutôt</b> discrète. → Olga est <b>très</b> discrète.</p><p><i>plutôt</i> se remplace par un adverbe (<i>très</i>) → <i>plutôt</i> est un <b>adverbe</b>.</p><p>C’est LA manipulation à retenir pour les classes de mots : « par quel mot connu je peux le remplacer ? »</p>' }
  ],
  items: [
    { t:'mc', tag:'manip', q:'« Olga est <b>plutôt</b> discrète. » → « Olga est <b>très</b> discrète. »<br>Quelle manipulation a-t-on faite ?', opts: MANIP_OPTS, a:4,
      why:'On a <b>remplacé</b> <i>plutôt</i> par <i>très</i>, un autre adverbe. Le remplacement sert à trouver la classe d’un mot.' },
    { t:'mc', tag:'manip', q:'« J’ai une idée. » → « J’ai une idée <b>géniale</b>. »', opts: MANIP_OPTS, a:0,
      why:'On a <b>ajouté</b> un adjectif après <i>idée</i>. Si on peut ajouter un adjectif, le mot est un nom.' },
    { t:'mc', tag:'manip', q:'« Les feuilles tombées au sol forment un joli tapis. » → « <b>Ce sont</b> les feuilles tombées au sol <b>qui</b> forment un joli tapis. »', opts: MANIP_OPTS, a:3,
      why:'On a <b>encadré</b> le groupe par <i>ce sont… qui</i> : c’est le test pour trouver le <b>sujet</b> de la phrase.' },
    { t:'mc', tag:'manip', q:'« Mes voisins ont organisé une fête <b>l’automne dernier</b>. » → « <b>L’automne dernier</b>, mes voisins ont organisé une fête. »', opts: MANIP_OPTS, a:1,
      why:'On a <b>déplacé</b> le groupe. Un groupe qu’on peut déplacer est un complément de phrase.' },
    { t:'mc', tag:'manip', q:'Quelle manipulation te permet de vérifier qu’un mot est un <b>verbe conjugué</b> ?', opts:['L’ajout d’un adjectif', 'L’encadrement par ne… pas', 'Le déplacement', 'L’effacement'], a:1,
      why:'Le verbe conjugué se laisse encadrer par <i>ne… pas</i> : « Je <b>ne</b> bois <b>pas</b> ». Un nom ou un adjectif, non.' },
    { t:'mc', tag:'manip', q:'« <s>Les nuits sans lune,</s> des amateurs d’astronomie viennent camper ici. »', opts: MANIP_OPTS, a:2,

  ]
},

/* ───────────────────────────── 1. LE NOM ───────────────────────────── */
{
  id: 'nom', cls: 'nom', title: 'Le nom', minutes: 5,
  intro: 'Le noyau du groupe nominal. Il donne ses accords aux autres.',
  defaultHint: 'Un nom se remplace par un autre nom (le navire → le bateau) et on peut ajouter un adjectif après lui (la porte → la grande porte). Il est souvent précédé d’un déterminant.',
  lesson: [
    { h: 'C’est quoi, un nom ?',
      b: '<p>Le nom désigne une <b>personne</b>, un <b>animal</b>, un <b>objet</b>, un <b>lieu</b>, une <b>époque</b>, un <b>évènement</b>, un <b>sentiment</b>, un concept…</p><p>C’est une classe <b>variable</b>. Il est toujours le <b>noyau d’un groupe nominal (GN)</b>.</p><p class="ex">l’<b>école</b> · un <b>cahier</b> · <b>Kim Thúy</b> · <b>Montréal</b> · la <b>joie</b></p>' },
    { h: 'Commun ou propre',
      b: '<p><b>Nom commun</b> : généralement précédé d’un déterminant.</p><p class="ex">le <b>lapin</b> · une <b>idée</b> · le très grand <b>local</b></p><p><b>Nom propre</b> : commence par une <b>majuscule</b>. Ce sont des personnes, des lieux, des habitants.</p><p class="ex"><b>Georges Perec</b> · <b>Montréal</b> · un <b>Québécois</b></p>' },
    { h: 'Genre, nombre… et donneur d’accord',
      b: '<p>Le nom a un <b>genre qui lui est propre</b> (masculin ou féminin) et il varie en <b>nombre</b> (singulier ou pluriel).</p><p>Il est <b>DONNEUR d’accord</b> : il donne son genre, son nombre et sa personne (3<sup>e</sup>) au déterminant, à l’adjectif et au verbe.</p><p class="ex"><u>Cette</u> <b>école</b> <u>est</u> <u>grande</u>. → école = f. s. → cette (f. s.), grande (f. s.), est (3<sup>e</sup> pers. s.)</p><p>Astuce pour le genre : ajoute un adjectif qui change au féminin. <i>mon expérience fabuleuse</i> → f.</p>' },
    { h: 'Noms animés, noms composés',
      b: '<p>Les noms <b>animés</b> (vivant et qui bouge) varient souvent en genre :</p><p class="ex">un enseignant → une enseignant<b>e</b> · un lion → une lion<b>ne</b> · un canard → une <b>cane</b> · une biche → un <b>cerf</b></p><p><b>Forme simple</b> : un roman. <b>Forme composée</b> (plusieurs mots) : un arc-en-ciel, un sac de couchage, une planche à voile, une grand-mère.</p><p>Attention : les noms composés n’ont <b>pas toujours</b> de trait d’union.</p>' },
    { h: 'Pour reconnaître un nom',
      b: '<p><b>Remplace</b>-le par un autre nom qui fonctionne dans le contexte :</p><p class="ex">Le <b>navire</b> voguait. → Le <b>bateau</b> voguait. ✓</p><p>ou <b>ajoute</b> un adjectif avant ou après :</p><p class="ex">la <b>porte</b> → la <u>grande</u> <b>porte</b> <u>jaune</u> ✓</p><p>Piège : le même mot peut être un nom ou un verbe. <i>Elle <b>danse</b></i> (verbe : elle dansait) / <i>cette nouvelle <b>danse</b></i> (nom : cette nouvelle chanson).</p>' }
  ],
  items: [
    { t:'tap', tag:'nom', q:'Tape sur tous les <b>noms</b> (il y en a 4).',
      s:'La truffe du chien est unique, tout comme les empreintes digitales chez les humains.', a:['truffe','chien','empreintes','humains'],
      why:'Quatre noms, chacun introduit par un déterminant : <i>la</i> truffe, <i>du</i> chien, <i>les</i> empreintes, <i>les</i> humains. <i>digitales</i> et <i>unique</i> sont des adjectifs.' },
    { t:'mc', tag:'nom', q:'Dans quelle phrase le mot <b>danse</b> est-il un nom ?', opts:['Elle souhaite apprendre cette nouvelle <b>danse</b>.', 'Élie <b>danse</b> très bien.'], a:0,
      why:'Dans la première, on peut le remplacer par un autre nom (<i>cette nouvelle chanson</i>) et il y a un déterminant devant (<i>cette</i>). Dans la deuxième, <i>danse</i> se conjugue (<i>Élie dansait</i>) : c’est un verbe.' },
    { t:'mc', tag:'nom', q:'Dans quelle phrase le mot <b>lit</b> est-il un nom ?', opts:['Ma mère ne <b>lit</b> jamais de roman.', 'Il y a plein de coussins sur mon <b>lit</b>.'], a:1,
      why:'<i>mon lit</i> → <i>mon divan</i> : remplacement par un nom ✓. Dans l’autre phrase, <i>lit</i> se conjugue (<i>elle ne lisait jamais</i>) : verbe.' },
    { t:'type', tag:'nom', q:'Écris le féminin : « un agriculteur » → « une … »', a:['agricultrice','une agricultrice'], placeholder:'une …',
      why:'Les noms en <i>-teur</i> font souvent <i>-trice</i> au féminin : agricultrice, illustratrice.' },
    { t:'type', tag:'nom', q:'Écris le féminin : « un lion » → « une … »', a:['lionne','une lionne'], placeholder:'une …',
      why:'On double la consonne et on ajoute <i>-e</i> : lion → lion<b>ne</b>, chat → chat<b>te</b>, Parisien → Parisien<b>ne</b>.' },
    { t:'type', tag:'nom', q:'Écris le masculin : « une biche » → « un … »', a:['cerf','un cerf'], placeholder:'un …',
      why:'Certains noms animés changent complètement de mot : biche → <b>cerf</b>, cane → canard.' },
    { t:'mc', tag:'nom', q:'Lequel est un <b>nom composé</b> ?', opts:['planche à voile', 'planche', 'grande planche'], a:0,
      why:'Un nom composé est formé de plusieurs mots, avec ou sans trait d’union : planche à voile, arc-en-ciel, couvre-lit, grand-mère. <i>grande planche</i> = adjectif + nom, ce n’est pas un nom composé.' },
    { t:'mc', tag:'nom', q:'Genre et nombre du nom en gras :<br>« J’ai pu admirer les <b>étoiles</b> dans toute leur splendeur. »', opts:['m. s.', 'f. s.', 'm. pl.', 'f. pl.'], a:3,
      why:'<i>une</i> étoile → féminin ; <i>les étoiles</i> → pluriel. Donc f. pl.' },
    { t:'mc', tag:'nom', q:'Quel est le genre du nom <b>hôpital</b> ?<br>« J’en ai oublié mon séjour à l’<b>hôpital</b>. »', opts:['masculin', 'féminin'], a:0,
      why:'Astuce : ajoute un adjectif qui change au féminin. <i>un <b>grand</b> hôpital</i> ✓ (et non <i>une grande hôpital</i>). Le dictionnaire confirme : n. m.' },
    { t:'mc', tag:'nom', q:'Le nom est un…', opts:['donneur d’accord', 'receveur d’accord'], a:0,
      why:'Il <b>donne</b> son genre, son nombre et sa 3<sup>e</sup> personne au déterminant, à l’adjectif et au verbe. Le déterminant et l’adjectif, eux, sont des receveurs.' },
    { t:'mc', tag:'nom', q:'« <b>Kim Thúy</b> » et « <b>Montréal</b> » sont…', opts:['des noms propres', 'des noms communs', 'des pronoms'], a:0,
      why:'Ils commencent par une majuscule et désignent une personne et un lieu : noms propres.' },
    { t:'tap', tag:'nom', q:'Tape sur les <b>noms</b> (il y en a 2).',
      s:'Les éléphants chantent entre eux, mais les humains ne peuvent pas les entendre.', a:['éléphants','humains'],

/* ───────────────────────────── 2. LE DÉTERMINANT ───────────────────────────── */
{
  id: 'det', cls: 'det', title: 'Le déterminant', minutes: 7,
  intro: 'Toujours à gauche d’un nom. Il reçoit ses accords du nom.',
  defaultHint: 'Un déterminant se trouve devant un NOM (il peut y avoir un adjectif entre les deux). Remplace-le par un autre déterminant : le / des / plusieurs…',
  lesson: [
    { h: 'C’est quoi, un déterminant ?',
      b: '<p>Classe <b>variable</b>. Le déterminant <b>introduit un nom</b> : il est toujours placé à gauche d’un nom et ne peut pas être utilisé seul. Il peut indiquer une quantité.</p><p class="ex"><b>le</b> bateau · <b>plusieurs</b> bateaux · <b>beaucoup de</b> bateaux</p><p>Il peut y avoir des mots entre le déterminant et le nom :</p><p class="ex"><b>cet</b> <i>immense</i> océan · <b>notre</b> <i>si belle</i> excursion · <b>aucune</b> <i>magnifique</i> baleine</p>' },
    { h: 'Receveur d’accord, simple ou composé',
      b: '<p>Il <b>reçoit</b> le genre et le nombre du nom.</p><p class="ex"><b>ce</b> dauphin (m. s.) · <b>des</b> baleines (f. pl.) · <b>cette</b> école (f. s.)</p><p><b>Simple</b> (un seul mot) : le, notre, plusieurs, treize.<br><b>Composé</b> (plusieurs mots) : n’importe quel, beaucoup de, la plupart des, combien de, peu d’.</p>' },
    { h: 'Les catégories',
      b: '<div class="tbl"><div><b>Défini</b> — le, la, l’, les<br><small>quelque chose de connu ou de général</small></div><div><b>Indéfini</b> — un, une, des, plusieurs, tout, chaque, certains, aucune<br><small>nombre ou identité non précisés</small></div><div><b>Possessif</b> — mon, ma, mes, ton, ta, tes, son, sa, ses, notre, nos, votre, vos, leur, leurs<br><small>appartenance</small></div><div><b>Démonstratif</b> — ce, cet, cette, ces<br><small>montrer, désigner</small></div><div><b>Numéral</b> — deux, quatre, trente-trois, mille<br><small>le nombre</small></div></div>' },
    { h: 'Harmoniser devant une voyelle ou un h muet',
      b: '<p>Devant <i>a, e, i, o, u, y</i> ou un <i>h</i> muet :</p><p class="ex">le / la → <b>l’</b> : l’aventure, l’homme, l’océan<br>ma / ta / sa → <b>mon / ton / son</b> : mon amie, son alimentation<br>ce → <b>cet</b> : cet individu, cet animal</p><p>Piège classique : <i>son alimentation</i> est bien féminin, mais on écrit <i>son</i> pour le son !</p>' },
    { h: 'Pour reconnaître un déterminant',
      b: '<p><b>Remplace</b>-le par un autre déterminant :</p><p class="ex">Les requins possèdent <b>beaucoup de</b> dents. → <b>des</b> / <b>plusieurs</b> dents ✓</p><p><b>Piège :</b> déterminant ou pronom ? <i>le, la, les, l’, leur</i> peuvent être les deux.</p><p class="ex">Marly a appelé <b>les</b> secours. → devant un <b>nom</b> = déterminant<br>Marly <b>les</b> a appelés. → devant un <b>verbe</b> = pronom</p>' }
  ],
  items: [

    { t:'mc', tag:'det', q:'« Matthew <b>leur</b> demande de venir. <b>Leur</b> regard semble inquiet. »<br>Lequel des deux <i>leur</i> est un déterminant ?', opts:['leur demande', 'Leur regard'], a:1,

    { t:'mc', tag:'det', q:'« Il achète <b>le</b> pain. » / « Il <b>le</b> mange. »<br>Lequel des deux <i>le</i> est un déterminant ?', opts:['le pain', 'le mange'], a:0,

/* ───────────────────────────── 3. L’ADJECTIF ───────────────────────────── */
{
  id: 'adj', cls: 'adj', title: 'L’adjectif', minutes: 6,
  intro: 'Il qualifie ou classe un nom. Il reçoit genre et nombre.',
  defaultHint: 'Un adjectif se remplace par un autre adjectif (touchant → drôle) et s’accorde avec le nom. Trouve d’abord le nom qu’il précise.',
  lesson: [
    { h: 'C’est quoi, un adjectif ?',
      b: '<p>Classe <b>variable</b>. Noyau du <b>groupe adjectival (GAdj)</b>. Il exprime une <b>qualité</b>, une <b>caractéristique</b> ou un <b>classement</b> dans une catégorie.</p><p class="ex">une main <b>moite</b> · un <b>bon</b> fruit · le système <b>solaire</b></p><p>Il sert à qualifier ou à classer le nom (ou le pronom) auquel il se rattache et à enrichir un texte.</p>' },
    { h: 'Receveur d’accord',
      b: '<p>Il <b>reçoit</b> le genre et le nombre du nom ou du pronom.</p><p class="ex">la <b>longue</b> route (f. s.) · Elle était <b>seule</b> (f. s.) · Ils étaient <b>seuls</b> (m. pl.)</p><p>Attention : certains adjectifs ne changent pas au féminin.</p><p class="ex">Le lac était <b>calme</b>. La mer était <b>calme</b>.</p>' },
    { h: 'Qualifiant ou classifiant',
      b: '<p><b>Qualifiant</b> = une qualité, une caractéristique : moite, bon, ombragée, immense.<br><b>Classifiant</b> = un classement dans une catégorie : solaire, québécoise, scolaire.</p><p>Test : seul le <b>qualifiant</b> accepte un adverbe d’intensité (très, peu, vraiment).</p><p class="ex">des mains <u>vraiment</u> <b>moites</b> ✓ · l’autobus <u>très</u> <b>scolaire</b> ✗</p><p>Le classifiant est toujours placé <b>directement après</b> le nom.</p>' },
    { h: 'Les adjectifs participes',

  id: 'adv', cls: 'adv', title: 'L’adverbe', minutes: 8,
  intro: 'Invariable et effaçable. Le module le plus important pour toi.',
  defaultHint: 'Trois tests : ① peux-tu l’EFFACER sans casser la phrase ? ② peux-tu le REMPLACER par un autre adverbe (très, vraiment, ici, souvent) ? ③ est-il INVARIABLE ? Un mot précédé d’un déterminant (nos villes, une matière) est un nom, jamais un adverbe.',
  lesson: [
    { h: 'C’est quoi, un adverbe ?',
      b: '<p>Classe <b>INVARIABLE</b> : il ne change <b>jamais</b> de forme (pas de <i>-e</i>, pas de <i>-s</i>). Noyau du <b>groupe adverbial (GAdv)</b>.</p><p>Il est <b>effaçable</b> : on peut l’enlever sans casser la phrase.</p><p class="ex">Le papier trouve <b>rapidement</b> le chemin du bac. → Le papier trouve le chemin du bac. ✓</p><p>Beaucoup d’adverbes se terminent par <b>-ment</b>.</p>' },
    { h: 'À quoi il sert',
      b: '<p>Préciser ou modifier le sens…</p><p class="ex">… d’un <b>verbe</b> : ils se recyclent <b>mal</b><br>… d’un <b>adjectif</b> : <b>totalement</b> indispensable<br>… d’un autre <b>adverbe</b> : <b>très</b> mal</p><p>Former une phrase négative (<b>ne… pas</b>, <b>ne… jamais</b>). Servir de complément de phrase (<b>Aujourd’hui</b>, …). Lier des phrases (<b>cependant</b>, <b>donc</b>, <b>par conséquent</b>).</p>' },
    { h: 'Les sens de l’adverbe',
      b: '<div class="tbl"><div><b>Affirmation</b> — certainement, oui, volontiers, vraiment</div><div><b>Négation</b> — non, ne… pas, ne… plus, ne… jamais</div><div><b>Opposition</b> — cependant, néanmoins, toutefois</div><div><b>Temps</b> — aujourd’hui, aussitôt, bientôt, hier, plus tard, souvent, toujours</div><div><b>Lieu</b> — ailleurs, dehors, ici, là-bas, près, partout</div><div><b>Manière</b> — vite, bien, mal, correctement, ainsi, doucement, calmement</div><div><b>Intensité</b> — peu, bien, très, assez, beaucoup, moins, environ, totalement</div><div><b>Conséquence</b> — alors, ainsi, donc, par conséquent</div></div><p><b>Simple</b> : très, ici. <b>Composé</b> : là-bas, ne… pas, tout à fait, par conséquent.</p>' },
    { h: 'Former un adverbe en -ment',
      b: '<p>On part souvent du <b>féminin de l’adjectif</b> et on ajoute <b>-ment</b> :</p><p class="ex">rapide → rapide<b>ment</b><br>sûr → sûre → sûre<b>ment</b><br>calme → calme<b>ment</b><br>léger → légère → légère<b>ment</b><br>correct → correcte → correcte<b>ment</b></p>' },
    { h: 'Pour reconnaître un adverbe : 3 tests',
      b: '<p>① <b>Efface</b>-le. La phrase tient encore ? Bon signe.</p><p>② <b>Remplace</b>-le par un autre adverbe que tu connais :</p><p class="ex">Edwina parle <b>couramment</b> l’inuktitut. → parle <b>vraiment</b> l’inuktitut ✓<br>Ludovic est <b>fort</b> doué. → est <b>extrêmement</b> doué ✓</p><p>③ Est-il <b>invariable</b> ?</p><p class="warn">Un mot précédé d’un <b>déterminant</b> (<i>nos <b>villes</b></i>, <i>une <b>matière</b></i>, <i>les <b>accidents</b></i>) est un <b>nom</b>. Et <i>plusieurs</i>, <i>certains</i> devant un nom sont des <b>déterminants</b>. Trouver un synonyme ne suffit pas : vérifie la classe !</p>' },
    { h: 'Les pièges',
      b: '<p><b>Adverbe ou préposition ?</b> <i>avant, derrière, devant, depuis</i> peuvent être les deux. La préposition a <b>toujours un complément à sa droite</b> et ne s’efface pas.</p><p class="ex">Il s’est endormi <b>avant</b> moi. → préposition (<i>avant</i> + <i>moi</i>)<br>J’aurais dû étudier <b>avant</b>. → adverbe (effaçable)</p><p><b>Adverbe ou conjonction ?</b> On peut déplacer un adverbe, jamais une conjonction.</p><p><b>Adverbe, adjectif ou nom ?</b></p><p class="ex">cet oiseau vole <b>bas</b> → adverbe (modifie <i>vole</i>)<br>les nuages <b>bas</b> → adjectif (s’accorde)<br>le <b>bas</b> de mon maillot → nom (déterminant <i>le</i>)</p>' }
  ],
  items: [
    { t:'tap', tag:'adv', q:'Tape sur les <b>adverbes</b> (il y en a 3).',
      s:'Aujourd’hui, le recyclage est bien implanté dans nos villes et nos villages : le papier et le carton trouvent rapidement le chemin du bac.', a:['aujourd’hui','bien','rapidement'],
      why:'<i>Aujourd’hui</i> (temps), <i>bien</i> (modifie <i>implanté</i>), <i>rapidement</i> (manière, modifie <i>trouvent</i>). <b>Attention :</b> <i>villes</i> et <i>villages</i> sont des <b>noms</b> (<i>nos</i> villes) ; on ne peut pas les effacer.',
      hint:'Efface les mots un à un. Ceux qui partent sans casser la phrase et qui ne sont pas précédés d’un déterminant…' },
    { t:'tap', tag:'adv', q:'Tape sur les <b>adverbes</b> (il y en a 3).',
      s:'Plusieurs personnes se posent toujours cette question : la boite de pizza peut-elle être recyclée ? Oui, elle peut l’~être si elle est propre ou légèrement souillée.', a:['toujours','oui','légèrement'],
      why:'<i>toujours</i> (temps), <i>Oui</i> (affirmation), <i>légèrement</i> (manière, modifie <i>souillée</i>). <b>Piège :</b> <i>Plusieurs</i> est un <b>déterminant</b> (devant le nom <i>personnes</i>).',
      hint:'« Plusieurs » est devant un nom… quelle classe est toujours devant un nom ?' },
    { t:'tap', tag:'adv', q:'Tape sur l’<b>adverbe</b> (il y en a 1).',
      s:'Les cannettes sont en aluminium, une matière qui se recycle facilement.', a:['facilement'],
      why:'<i>facilement</i> (manière, modifie <i>se recycle</i>) : en <i>-ment</i>, effaçable, invariable. <i>matière</i> est un <b>nom</b> (<i>une</i> matière).' },
    { t:'tap', tag:'adv', q:'Tape sur les <b>adverbes</b> (4 mots, dont un adverbe composé en deux mots).',
      s:'Il faut cependant faire attention. Certains objets ne doivent jamais être jetés dans un bac : ils doivent absolument être déposés dans un écocentre.', a:['cependant','ne','jamais','absolument'],
      why:'<i>cependant</i> (opposition), <i>ne… jamais</i> (négation, adverbe composé), <i>absolument</i> (intensité). <b>Piège :</b> <i>Certains</i> est un <b>déterminant</b> (devant <i>objets</i>).',
      hint:'La négation compte pour un adverbe composé : deux mots à taper.' },
    { t:'mc', tag:'adv', q:'Sens de <b>Par conséquent</b> :<br>« <b>Par conséquent</b>, tu peux recycler quand tu voyages. »', opts: SENS_ADV, a:7,
      why:'<i>par conséquent, donc, alors, ainsi</i> expriment la <b>conséquence</b>. C’est un adverbe composé.' },
    { t:'mc', tag:'adv', q:'Sens de <b>Partout</b> :<br>« <b>Partout</b> sur la planète, les matériaux recyclables sont identifiés par un triangle. »', opts: SENS_ADV, a:4,
      why:'<i>partout, ici, dehors, là-bas, ailleurs</i> expriment le <b>lieu</b>.' },
    { t:'mc', tag:'adv', q:'« certains produits se recyclent <b>très</b> mal »<br><i>très</i> modifie…', opts:['le verbe <i>recyclent</i>', 'l’adverbe <i>mal</i>', 'le nom <i>produits</i>'], a:1,
      why:'<i>très</i> (intensité) précise à quel point c’est <i>mal</i> : il modifie un autre <b>adverbe</b>.' },
    { t:'mc', tag:'adv', q:'« Lavez <b>correctement</b> vos contenants. »<br><i>correctement</i> modifie…', opts:['le verbe <i>Lavez</i>', 'le nom <i>contenants</i>', 'le déterminant <i>vos</i>'], a:0,
      why:'Il dit <b>comment</b> laver (manière) : il modifie le verbe.' },
    { t:'mc', tag:'adv', q:'« une <b>bien</b> meilleure idée »<br><i>bien</i> modifie…', opts:['le nom <i>idée</i>', 'l’adjectif <i>meilleure</i>', 'le déterminant <i>une</i>'], a:1,
      why:'<i>bien</i> (intensité) renforce l’adjectif <i>meilleure</i>. Remplacement : <i>une <b>vraiment</b> meilleure idée</i> ✓.' },
    { t:'type', tag:'adv', q:'Forme l’adverbe en <b>-ment</b> : « de façon rapide » → …', a:['rapidement'], placeholder:'…ment',
      why:'rapide + <b>-ment</b> = rapidement.' },
    { t:'type', tag:'adv', q:'Forme l’adverbe en <b>-ment</b> : « de manière sûre » → …', a:['sûrement','surement'], placeholder:'…ment',
      why:'sûr → sûr<b>e</b> → sûre<b>ment</b>. (Les deux graphies <i>sûrement</i> et <i>surement</i> sont acceptées.)' },
    { t:'type', tag:'adv', q:'Forme l’adverbe en <b>-ment</b> : « de façon calme » → …', a:['calmement'], placeholder:'…ment',
      why:'calme + <b>-ment</b> = calmement.' },
    { t:'mc', tag:'adv', q:'Dans quelle phrase <b>bas</b> est-il un adverbe ?', opts:['J’ai perdu le <b>bas</b> de mon maillot de bain.', 'Vois-tu comme cet oiseau vole <b>bas</b> ?', 'Les nuages <b>bas</b> annoncent la pluie.'], a:1,
      why:'<i>vole bas</i> → <i>vole <b>haut</b></i> : il modifie le verbe <i>vole</i> → adverbe. <i>le bas</i> = nom (déterminant <i>le</i>) ; <i>nuages bas</i> = adjectif (<i>des nuages gris</i>).' },
    { t:'mc', tag:'adv', q:'« Il s’est endormi <b>avant</b> moi. »<br><i>avant</i> est…', opts:['un adverbe', 'une préposition'], a:1,
      why:'Il a un complément à sa droite (<i>moi</i>) et on ne peut pas l’effacer (<i>Il s’est endormi moi</i> ✗) → <b>préposition</b>.' },
    { t:'mc', tag:'adv', q:'« J’aurais dû étudier <b>avant</b>. »<br><i>avant</i> est…', opts:['un adverbe', 'une préposition'], a:0,
      why:'Aucun complément après lui, et il s’efface : <i>J’aurais dû étudier.</i> ✓ → <b>adverbe</b>.' },
    { t:'mc', tag:'adv', q:'« Nous avons dû laisser les blessés <b>derrière</b>. »<br><i>derrière</i> est…', opts:['un adverbe', 'une préposition'], a:0,
      why:'Rien après lui, effaçable → adverbe. Compare : <i>réfugié <b>derrière</b> le hangar</i> → préposition (complément <i>le hangar</i>).' },
    { t:'mc', tag:'adv', q:'Vrai ou faux : « L’adverbe s’accorde avec le nom. »', opts:['Vrai', 'Faux'], a:1,
      why:'<b>Faux.</b> L’adverbe est invariable : <i>des filles <b>vraiment</b> gentilles</i> — <i>vraiment</i> ne change pas.' },
    { t:'mc', tag:'adv', q:'« Tu détestes <b>sans doute</b> les détritus. »<br>Remplace <i>sans doute</i> par un adverbe de même sens :', opts:['certainement', 'dehors', 'tellement'], a:0,
      why:'<i>sans doute</i> et <i>certainement</i> expriment l’<b>affirmation</b>. <i>sans doute</i> est un adverbe composé.' },
    { t:'mc', tag:'adv', q:'« Ludovic est <b>fort</b> doué en mathématiques. »<br>Ici, <i>fort</i> est…', opts:['un adjectif', 'un adverbe', 'un nom'], a:1,
      why:'<i>fort</i> → <i><b>extrêmement</b> doué</i> ✓ : il modifie l’adjectif <i>doué</i> et ne s’accorde pas (<i>Julie est fort douée</i>) → adverbe d’intensité.' }
  ]
},

/* ───────────────────────────── 7. LA PRÉPOSITION ───────────────────────────── */
{
  id: 'prep', cls: 'prep', title: 'La préposition', minutes: 7,
  intro: 'Invariable. Elle introduit toujours un complément à sa droite.',
  defaultHint: 'Une préposition a toujours un complément à sa droite et ne s’efface pas. Remplace-la par une autre préposition (à cause de → avant / sans). Pour « de » : mets le nom au singulier et remplace « de » par un / une / le / la.',
  lesson: [
    { h: 'C’est quoi, une préposition ?',
      b: '<p>Classe <b>INVARIABLE</b>. Elle <b>ne peut pas être employée seule</b>. Noyau du <b>groupe prépositionnel (GPrép)</b>.</p><p>Elle introduit <b>toujours un complément</b> placé à sa droite.</p><p class="ex"><b>à</b> Montréal · <b>de</b> mon ami · <b>pour</b> voyager · <b>grâce à</b> toi · <b>sous</b> les mers</p>' },
    { h: 'Forme et sens',
      b: '<p><b>Simple</b> : à, dans, en, pour, sur, avec, sans, vers, chez, par, sous.<br><b>Composée</b> : à cause de, loin de, grâce à, au lieu de, en raison de, afin de.</p><div class="tbl"><div><b>Appartenance</b> — à, de</div><div><b>Temps</b> — à, avant, au cours de, depuis, dès, pendant, jusqu’à</div><div><b>Lieu / direction</b> — à, chez, dans, en, sous, sur, vers, près de, loin de</div><div><b>Cause / origine</b> — de, par, à cause de, en raison de, grâce à</div><div><b>But</b> — afin de, pour, dans le but de, en vue de</div><div><b>Moyen / manière</b> — à, de, avec, en, par, au moyen de</div><div><b>Opposition</b> — contre, malgré, au lieu de, à la place de, en dépit de</div><div><b>Exclusion</b> — excepté, sans, sauf</div></div><p><i>à, de, en, avec, pour</i> ont plusieurs sens selon le contexte.</p>' },
    { h: 'Pour reconnaître une préposition',
      b: '<p><b>Remplace</b>-la par une autre préposition :</p><p class="ex">Je me suis réveillée <b>à cause de</b> toi. → <b>avant</b> / <b>sans</b> toi ✓</p><p>Elle a toujours un complément à droite et ne s’efface pas.</p>' },
    { h: '« de » : préposition ou déterminant ?',
      b: '<p>L’astuce du manuel :</p><p>① Regarde le <b>nom à sa droite</b>.<br>② Mets ce nom au <b>singulier</b>.<br>③ Remplace <i>de</i> par <b>un / une</b> ou <b>le / la</b>.</p><p class="ex">J’ai rencontré <b>de</b> grands cascadeurs. → J’ai rencontré <b>un</b> grand cascadeur. ✓ → <b>déterminant</b></p><p class="ex">Un groupe <b>de</b> musiciens joue. → Un groupe <b>un</b> musicien joue. ✗ → <b>préposition</b></p>' },
    { h: 'Préposition ou adverbe ?',
      b: '<p><i>avant, derrière, devant, depuis, contre</i>… peuvent être les deux.</p><p class="ex">Joud s’est réfugié <b>derrière</b> le hangar. → préposition (complément : <i>le hangar</i>)<br>Nous avons dû laisser les blessés <b>derrière</b>. → adverbe (seul, effaçable)</p><p>Règle : la préposition a un complément à droite ; l’adverbe est seul et effaçable.</p>' }
  ],
  items: [
    { t:'mc', tag:'prep', q:'Sens de <b>vers</b> : « les vols <b>vers</b> plusieurs pays »', opts: SENS_PREP, a:2,
      why:'<i>vers</i> indique une direction : <b>lieu / direction</b>.' },
    { t:'mc', tag:'prep', q:'Sens de <b>pendant</b> : « annulés <b>pendant</b> plusieurs mois »', opts: SENS_PREP, a:1,
      why:'Une durée : <b>temps</b>.' },
    { t:'mc', tag:'prep', q:'Sens de <b>Pour</b> : « <b>Pour</b> voyager, j’ai dû me débrouiller avec mon imagination. »', opts: SENS_PREP, a:4,
      why:'Dans quel but ? Pour voyager → <b>but</b>.' },
    { t:'mc', tag:'prep', q:'Sens de <b>avec</b> : « me débrouiller <b>avec</b> mon imagination »', opts: SENS_PREP, a:5,
      why:'Au moyen de mon imagination → <b>moyen / manière</b>.' },
    { t:'mc', tag:'prep', q:'Sens de <b>grâce à</b> : « <b>grâce à</b> une bonne connexion Internet »', opts: SENS_PREP, a:3,
      why:'La connexion est la cause qui a permis d’explorer : <b>cause / origine</b>. <i>grâce à</i> est une préposition <b>composée</b>.' },
    { t:'mc', tag:'prep', q:'Sens de <b>sans</b> : « <b>sans</b> quitter mon salon »', opts: SENS_PREP, a:7,

    { t:'mc', tag:'prep', q:'« Je lis souvent <b>au lieu d’</b>étudier. »<br><i>au lieu de</i> est une préposition…', opts:['simple, qui exprime le temps', 'composée, qui exprime l’opposition', 'composée, qui exprime le lieu'], a:1,
      why:'Plusieurs mots → composée. Sens : à la place de → <b>opposition</b>. (Ne te laisse pas piéger par le mot <i>lieu</i> !)' },
    { t:'mc', tag:'prep', q:'« Cet auteur est mon idole <b>de</b> jeunesse. »<br><i>de</i> est…', opts:['une préposition', 'un déterminant'], a:0,

    { t:'mc', tag:'prep', q:'« <b>De</b> merveilleuses découvertes vous attendent en lisant. »<br><i>De</i> est…', opts:['une préposition', 'un déterminant'], a:1,

    { t:'mc', tag:'prep', q:'« J’apprécie tous les genres <b>de</b> romans. »<br><i>de</i> est…', opts:['une préposition', 'un déterminant'], a:0,
      why:'Test : <i>les genres <b>un</b> roman</i> ✗ → <b>préposition</b>.' },
    { t:'mc', tag:'prep', q:'« J’ai reçu <b>de</b> beaux livres à ma fête. »<br><i>de</i> est…', opts:['une préposition', 'un déterminant'], a:1,
      why:'Test : <i>J’ai reçu <b>un</b> beau livre</i> ✓ → <b>déterminant</b>.' },
    { t:'mc', tag:'prep', q:'« J’ai reçu <b>de</b> ma mère le dernier tome de ma série favorite. »<br><i>de</i> (devant <i>ma mère</i>) est…', opts:['une préposition', 'un déterminant'], a:0,
      why:'Test : <i>J’ai reçu <b>la</b> mère</i> ✗ → <b>préposition</b> (elle indique de qui vient le livre : origine).' },
    { t:'mc', tag:'prep', q:'« Jules Verne a écrit plusieurs romans qui parlent <b>de</b> voyage. »<br><i>de</i> est…', opts:['une préposition', 'un déterminant'], a:0,
      why:'Test : <i>qui parlent <b>un</b> voyage</i> ✗ → <b>préposition</b>.' },
    { t:'mc', tag:'prep', q:'Complète (sens : <b>lieu</b>) : « <i>Vingt mille lieues</i> ___ <i>les mers</i> »', opts:['sous', 'pendant', 'afin de'], a:0,

    { t:'mc', tag:'prep', q:'Complète (sens : <b>but</b>) : « trois hommes pourchassent un monstre ___ le capturer. »', opts:['afin de', 'malgré', 'depuis'], a:0,

    { t:'mc', tag:'prep', q:'Complète (sens : <b>opposition</b>) : « mais ___ la capturer, c’est eux qui sont faits prisonniers. »', opts:['au lieu de', 'grâce à', 'pendant'], a:0,

    { t:'mc', tag:'prep', q:'« La route vers le sommet est juste <b>devant</b> toi. »<br><i>devant</i> est…', opts:['une préposition', 'un adverbe'], a:0,

/* ───────────────────────────── 8. LA CONJONCTION ───────────────────────────── */
{
  id: 'conj', cls: 'conj', title: 'La conjonction', minutes: 5,
  intro: 'Invariable, jamais déplaçable. Elle relie ou elle introduit.',
  defaultHint: 'Une conjonction se remplace par une autre conjonction (aussitôt que → quand / car / si). Elle ne se déplace jamais. Coordination = relie des éléments de même fonction ; subordination = introduit une phrase dans une autre.',
  lesson: [
    { h: 'C’est quoi, une conjonction ?',
      b: '<p>Classe <b>INVARIABLE</b>. Elle n’est <b>jamais déplaçable</b>.</p><p>Il existe deux types : la conjonction de <b>coordination</b> et la conjonction de <b>subordination</b>.</p>' },
    { h: 'La coordination',
      b: '<p>Elle <b>relie</b> des groupes de mots de même fonction, des subordonnées de même fonction, ou des phrases.</p><p class="ex">Prends du pain <b>et</b> du fromage. (groupes de mots)<br>Il achète une tarte, <b>car</b> il adore les desserts. (phrases)</p><div class="tbl"><div><b>Addition</b> — et, ni, ainsi que</div><div><b>Cause / explication</b> — car, comme, c’est-à-dire, à savoir</div><div><b>Opposition / restriction</b> — mais, or, sauf</div><div><b>Alternative</b> — ou, ou… ou, ou bien, soit… soit</div></div>' },
    { h: 'La subordination',
